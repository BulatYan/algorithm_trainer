<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>{{ title }}</title>

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }

        .main-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .navbar-custom {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header class="container mt-3">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary navbar-custom px-3">
        <div class="ms-auto">
            <a class="btn btn-outline-light me-2" href="/login">Войти</a>
            <a class="btn btn-light text-primary fw-bold" href="/register">Зарегистрироваться</a>
        </div>

    </nav>
</header>

<main class="container mt-4">
    <div class="main-card p-4">
        {% block content %}{% endblock %}
    </div>
</main>

</body>
</html>
