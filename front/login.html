<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #8ba3a3, #1c1f26);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .card {
            background: #afa8a8;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 0 30px rgba(115, 71, 71, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px 14px 14px;
            border-radius: 6px;
            border: 2px solid transparent;
            background: #201f1f;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            z-index: 2;

            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle:hover {
            color: #fff;
        }

        .toggle svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .input-error {
            border: 2px solid #e12525 !important;
        }

        .input-success {
            border: 2px solid #02682b !important;
        }

        .form-error {
            color: #e12525;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #717a75;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #8f6f6f;
        }
    </style>
</head>

<body>

<div class="card">
    <form id="loginForm" novalidate>

        <div class="form-group">
            <input type="email" id="email" placeholder="Email">
        </div>

        <div class="form-group">
            <input type="password" id="password" placeholder="Пароль">

            <span class="toggle" onclick="togglePassword()">
                <!-- глаз -->
                <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>

                <!-- перечеркнутый -->
                <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-6.94"/>
                    <path d="M1 1l22 22"/>
                </svg>
            </span>
        </div>

        <div id="formError" class="form-error"></div>

        <button type="submit">Войти</button>

    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("formError");

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        function togglePassword() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeOpen.style.display = "none";
                eyeClosed.style.display = "block";
            } else {
                passwordInput.type = "password";
                eyeOpen.style.display = "block";
                eyeClosed.style.display = "none";
            }
        }

        window.togglePassword = togglePassword;

        function setError(input) {
            input.classList.add("input-error");
            input.classList.remove("input-success");
        }

        function setSuccess(input) {
            input.classList.remove("input-error");
            input.classList.add("input-success");
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            errorBox.textContent = "";

            let isValid = true;

            if (!validateEmail(emailInput.value.trim())) {
                setError(emailInput);
                isValid = false;
            } else {
                setSuccess(emailInput);
            }

            if (passwordInput.value.length < 6) {
                setError(passwordInput);
                isValid = false;
            } else {
                setSuccess(passwordInput);
            }

            if (!isValid) {
                errorBox.style.color = "#e12525";
                errorBox.textContent = "Ошибка: проверьте данные";
                return;
            }

            errorBox.style.color = "#02682b";
            errorBox.textContent = "Все корректно";

            // Перенаправление на base.html после успешной валидации
            setTimeout(() => {
                window.location.href = "/";
            }, 1000);
        });

    });
</script>

</body>
</html>
